name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A PostgreSQL server for the change notification test (triggers, LISTEN/NOTIFY).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: queryeables
          POSTGRES_DB: queryeables
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUERYEABLES_POSTGRES: Host=localhost;Port=5432;Database=queryeables;Username=postgres;Password=queryeables
      QUERYEABLES_MONGODB: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Queryeables.slnx

      - name: Build
        run: dotnet build Queryeables.slnx -c Release --no-restore

      # Transactions and change streams need a replica set: a single node is enough. A service container cannot be started
      # with --replSet, hence the step.
      # MongoDB 7.0: 8.x refuses to start on Linux 6.19 and newer (SERVER-121912, TCMalloc and rseq), the kernel of the
      # runners. Queryeables uses nothing 8.x adds; go back to 8.x once the runners or MongoDB allow it.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          running() { [ "$(docker inspect -f '{{.State.Running}}' mongo)" = "true" ]; }
          for i in $(seq 1 60); do
            running || { echo "MongoDB stopped"; docker logs mongo; exit 1; }
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }" && break
            sleep 2
          done
          for i in $(seq 1 60); do
            running || { echo "MongoDB stopped"; docker logs mongo; exit 1; }
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && exit 0
            sleep 1
          done
          echo "MongoDB did not become primary" && docker logs mongo && exit 1

      - name: Test
        run: dotnet test Queryeables.slnx -c Release --no-build --logger trx --results-directory TestResults

      # Many clients writing online and offline while their networks come and go: longer than in the test suite.
      - name: Convergence under load
        run: dotnet test Queryeables.slnx -c Release --no-build --filter "FullyQualifiedName~ConvergenceTests"
        env:
          QUERYEABLES_LOAD_SCALE: 5

      # Each network benchmark once: a real server on 127.0.0.1 (Kestrel, gRPC, MagicOnion) answers a real client.
      - name: Network benchmarks, once
        run: dotnet run -c Release --project Queryeables.Benchmarks --no-build -- --filter "*NetworkBenchmarks*" --job dry

      - name: Run the sample (SQLite, Dommel, generator, cache, in-process remote client)
        run: dotnet run --project Samples/Queryeables.Sample -c Release --no-build

      - name: Run the offline demo (two clients, a network cut, concurrent writes, a conflict)
        run: dotnet run --project Samples/Queryeables.OfflineDemo -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: TestResults

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack Queryeables.slnx -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}

      # The way in of a newcomer, with the packages just made: the templates are installed, generated outside the
      # repository, restored from these packages (and only them for Queryeables.*), built and run.
      - name: Templates, from the packages
        shell: bash
        run: |
          feed="$GITHUB_WORKSPACE/artifacts"
          work="$RUNNER_TEMP/newcomer"
          mkdir -p "$work" && cd "$work"
          cat > nuget.config <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="queryeables-local" value="$feed" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="queryeables-local"><package pattern="Queryeables" /><package pattern="Queryeables.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet new install "$feed/Queryeables.Templates.${{ steps.version.outputs.value }}.nupkg"

          dotnet new queryeables-console -n Newcomer -o console
          dotnet run --project console

          dotnet new queryeables-client-server -n Shop -o client-server
          dotnet build client-server/Shop.slnx
          dotnet run --project client-server/Shop.Server --no-build &
          server=$!
          trap 'kill $server' EXIT
          dotnet run --project client-server/Shop.Client --no-build

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages
          path: artifacts/*.nupkg

  # File names, paths and line endings differ on Windows and macOS (FileOfflineStorage, SQLite): the tests run there too,
  # without the servers (their tests are reported as skipped).
  other-systems:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Queryeables.Tests/Queryeables.Tests.csproj -c Release

  # The AOT / trimming guarantee, proven rather than declared: a console app using Queryeables the way an application does
  # is published with Native AOT (any trim or AOT warning fails the publish) and the native binary is run.
  aot:
    name: Native AOT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish the smoke app with Native AOT
        run: dotnet publish Queryeables.AotSmoke/Queryeables.AotSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-smoke

      - name: Run the native binary
        run: ./artifacts/aot-smoke/Queryeables.AotSmoke

  publish:
    # Publishes to nuget.org when a tag such as v0.1.0 is pushed, with Trusted Publishing: no stored API key. nuget.org has a
    # policy for this repository and this workflow file (ci.yml); NuGet/login exchanges the GitHub OIDC token for a
    # short-lived key.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, other-systems, aot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: artifacts

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: cedricb          # the nuget.org profile name that owns the policy, not an email

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
