name: CLA

# Every external contributor signs the Contributor License Agreement (CLA.md) once, by a comment on the pull request.
# Signatures are recorded in the cla-signatures branch. The maintainer is exempt.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/master/CLA.md
          branch: cla-signatures
          allowlist: cedric56,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/master/CLA.md)
            and sign it by posting the comment below. You sign once for all your contributions.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
