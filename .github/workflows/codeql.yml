name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The Routeables Remote Protocol, for Queryeables.Replication (see ci.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cedric56/Routeables.SignalR
          ref: 2244cac9de74e0ef369ad1dc0f6dad407f87cd5b   # the same as ROUTEABLES_SIGNALR_REF in ci.yml
          path: .external/Routeables.SignalR
      - name: Put Routeables.SignalR next to this repository
        shell: bash
        run: mv .external/Routeables.SignalR ../Routeables.SignalR

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      # C# without a build: the sources are analyzed as they are, the source generators excepted.
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:csharp
